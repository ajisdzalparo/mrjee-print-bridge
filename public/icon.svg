<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Top Antennas -->
  <rect x="36" y="22" width="3.5" height="12" fill="#2b3742" rx="1" />
  <rect x="60.5" y="22" width="3.5" height="12" fill="#2b3742" rx="1" />
  
  <!-- Top Paper Slot Sheet -->
  <rect x="39" y="16" width="22" height="16" fill="#ffffff" stroke="#2b3742" strokeWidth="3" rx="1" />
  <line x1="43" y1="22" x2="57" y2="22" stroke="#2b3742" strokeWidth="2.5" strokeLinecap="round" />
  <line x1="43" y1="26" x2="53" y2="26" stroke="#2b3742" strokeWidth="2.5" strokeLinecap="round" />
  
  <!-- Main Printer Body Casing -->
